name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Validate submission entries
        run: python scripts/validate_entries.py
      - name: Leaderboard compiles
        run: |
          mkdir -p /tmp/site
          python scripts/compile_leaderboard.py --website /tmp/site
